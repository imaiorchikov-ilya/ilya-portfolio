<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f3d"/>
      <stop offset="50%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#0f131e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c4a0"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#mkbg)"/>
  <!-- Палитра кисти справа -->
  <g opacity="0.15">
    <rect x="520" y="120" width="60" height="560" rx="8" fill="#82c0c7"/>
    <rect x="535" y="140" width="30" height="30" rx="4" fill="#ff7f5e"/>
    <rect x="535" y="180" width="30" height="30" rx="4" fill="#7791f8"/>
    <rect x="535" y="220" width="30" height="30" rx="4" fill="#ffd700"/>
    <rect x="535" y="260" width="30" height="30" rx="4" fill="#ff4d8a"/>
    <rect x="535" y="300" width="30" height="30" rx="4" fill="#c9a96e"/>
  </g>
  <!-- Контур лица -->
  <ellipse cx="300" cy="360" rx="110" ry="145" fill="url(#skin)"/>
  <!-- Тень на шее -->
  <path d="M220 470 Q300 520 380 470 L380 550 Q300 580 220 550Z" fill="#c4966a"/>
  <!-- Румянец -->
  <ellipse cx="240" cy="390" rx="35" ry="25" fill="url(#blush)"/>
  <ellipse cx="360" cy="390" rx="35" ry="25" fill="url(#blush)"/>
  <!-- Хайлайтер -->
  <ellipse cx="300" cy="315" rx="25" ry="18" fill="url(#highlight)"/>
  <ellipse cx="240" cy="355" rx="12" ry="10" fill="url(#highlight)"/>
  <ellipse cx="360" cy="355" rx="12" ry="10" fill="url(#highlight)"/>
  <!-- Глаза -->
  <ellipse cx="260" cy="350" rx="14" ry="10" fill="#2a1f1a"/>
  <ellipse cx="340" cy="350" rx="14" ry="10" fill="#2a1f1a"/>
  <!-- Отблеск в глазах -->
  <circle cx="264" cy="346" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="344" cy="346" r="4" fill="#fff" opacity="0.8"/>
  <!-- Тени на веках -->
  <path d="M245 340 Q260 325 275 340" fill="none" stroke="#8b5a3c" stroke-width="3" opacity="0.4"/>
  <path d="M325 340 Q340 325 355 340" fill="none" stroke="#8b5a3c" stroke-width="3" opacity="0.4"/>
  <!-- Брови -->
  <path d="M240 325 Q260 315 280 322" fill="none" stroke="#5a3a2a" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 322 Q340 315 360 325" fill="none" stroke="#5a3a2a" stroke-width="4" stroke-linecap="round"/>
  <!-- Ресницы -->
  <path d="M245 355 Q255 360 265 355" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>
  <path d="M325 355 Q335 360 345 355" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>
  <!-- Губы -->
  <path d="M270 415 Q300 405 330 415 Q300 435 270 415Z" fill="#c44a5a"/>
  <path d="M275 415 Q300 425 325 415" fill="none" stroke="#a03040" stroke-width="1.5"/>
  <!-- Блеск на губах -->
  <ellipse cx="285" cy="412" rx="6" ry="3" fill="#fff" opacity="0.4"/>
  <ellipse cx="315" cy="412" rx="6" ry="3" fill="#fff" opacity="0.4"/>
  <!-- Помада в руке (справа внизу) -->
  <rect x="410" y="480" width="16" height="60" rx="3" fill="#222" opacity="0.6"/>
  <rect x="408" y="470" width="20" height="25" rx="3" fill="#c44a5a" opacity="0.8"/>
  <!-- Размытые световые акценты -->
  <circle cx="120" cy="200" r="80" fill="#ff7f5e" opacity="0.08"/>
  <circle cx="500" cy="600" r="100" fill="#82c0c7" opacity="0.06"/>
  <circle cx="450" cy="150" r="60" fill="#7791f8" opacity="0.05"/>
</svg>
